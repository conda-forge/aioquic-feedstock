# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.6.1"
  python_check_max: "3.14"

package:
  name: aioquic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioquic/aioquic-${{ version }}.tar.gz
  sha256: 9a10d20e69b5914d6fa034becb30ab75ef6a777a3f1b16623ca599e9291c0a5c

build:
  skip: is_abi3 and not is_python_min
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    version_independent: ${{ is_abi3 }}

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools >=70.1
    - if: is_abi3
      then:
        - python ${{ python_min }}.*
        - python-abi3
  run:
    - certifi
    - cryptography >=43.0.0
    - openssl
    - pylsqpack >=1.0.0,<2.0.0
    - pyopenssl >=24
    - python
    - service-identity >=24.1.0
    - if: is_abi3
      then:
        - python >=${{ python_min }}
        - python-abi3

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/aioquic/**
      site_packages:
        - aioquic/**
        - aioquic-${{ version }}.dist-info/**
  - python:
      imports:
        - aioquic
        - aioquic._buffer
        - aioquic._crypto
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - files:
      source:
        - tests/**
    requirements:
      run:
        - coverage
        - pytest
        - if: is_abi3
          then:
            - abi3audit
            - python ${{ python_min }}.*
    script:
      - coverage run --source=aioquic --branch -m pytest -vv --tb=long --color=yes -k "not connect_and_serve_ipv6"
      - if: linux
        then: coverage report --show-missing --skip-covered --fail-under=99
      - if: is_abi3
        then:
          - if: unix
            then: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "${SP_DIR}/aioquic/_buffer.abi3.so"
            else: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "%SP_DIR%\aioquic\_buffer.pyd"

about:
  summary: An implementation of QUIC and HTTP/3
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://pypi.org/project/aioquic
  repository: https://github.com/aiortc/aioquic
  documentation: https://aioquic.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
