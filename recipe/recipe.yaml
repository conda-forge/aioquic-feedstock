# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.25"
  # TODO: bump after e.g. https://github.com/conda-forge/pylsqpack-feedstock/pull/5
  python_check_max: "3.14"
  pytest_k: |-
    not (connect_and_serve_ipv6 or ec_certificate)

package:
  name: aioquic
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/a/aioquic/aioquic-${{ version }}.tar.gz
  sha256: 70795c78905326d855c2ae524072234aae586c789b81292e272d021e9b0430a3

build:
  skip: is_abi3 and not is_python_min
  number: 0
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check
  python:
    version_independent: ${{ is_abi3 }}

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
  host:
    - pip
    - python
    - setuptools
    - if: is_abi3
      then:
        - python-abi3
  run:
    - certifi
    - cryptography
    - openssl
    - pylsqpack >=0.3.3,<0.4.0
    - pyopenssl >=22
    - python
    - service-identity >=23.1.0

tests:
  - if: is_abi3
    then:
      python:
        imports:
          - aioquic
          - aioquic._buffer
          - aioquic._crypto
        pip_check: true
        python_version:
          - ${{ python_min }}.*
          - ${{ python_check_max }}.*
    else:
      python:
        imports:
          - aioquic
          - aioquic._buffer
          - aioquic._crypto
        pip_check: true
  - files:
      source:
        - tests/
    requirements:
      run:
        - coverage
        - pip
        - pytest
        - python ${{ python_min }}.*
    script:
      - pip check
      - coverage run --source=aioquic --branch -m pytest -vv --tb=long --color=yes -k "{{ pytest_k }}"
      - if: linux
        then: coverage report --show-missing --skip-covered --fail-under=99

about:
  summary: An implementation of QUIC and HTTP/3
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/aiortc/aioquic
  documentation: https://aioquic.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
