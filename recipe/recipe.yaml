schema_version: 1

context:
  version: "1.2.0"
  python_check_max: "3.14"

package:
  name: aioquic
  version: ${{ version }}

source:
  url: https://pypi.io/packages/source/a/aioquic/aioquic-${{ version }}.tar.gz
  sha256: f91263bb3f71948c5c8915b4d50ee370004f20a416f67fab3dcc90556c7e7199

build:
  skip: not (is_abi3 and match(python, python_min ~ ".*"))
  number: 2
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  python:
    version_independent: true

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then: 
        - python
        - cross-python_${{ target_platform }}
  host:
    - python
    - python-abi3
    - pip
    - setuptools
  run:
    - certifi
    - cryptography >=42.0.0
    - openssl
    - pylsqpack >=0.3.3,<0.4.0
    - pyopenssl
    - python
    - service-identity >=24.1.0

tests:
  - python:
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
      imports:
        - aioquic
        - aioquic._buffer
        - aioquic._crypto
  - files:
      source:
        - tests
    requirements:
      run:
        - coverage
        - pip
        - pytest
        - python ${{ python_min }}.*
    script:
      - pip check
      - coverage run --source=aioquic --branch -m pytest -vv --tb=long --color=yes -k "not connect_and_serve_ipv6"
      - if: linux
        then: coverage report --show-missing --skip-covered --fail-under=99

about:
  summary: An implementation of QUIC and HTTP/3
  license: BSD-3-Clause
  license_file: LICENSE
  homepage: https://github.com/aiortc/aioquic
  documentation: https://aioquic.readthedocs.io

extra:
  recipe-maintainers:
    - bollwyvl
